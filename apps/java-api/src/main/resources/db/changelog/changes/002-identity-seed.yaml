databaseChangeLog:
  - comment: >
      Identity seed — initial Administrator.
      The MVP ships with a single seeded admin (admin@deer) created via Liquibase
      so the team can log in on day 1 without a separate onboarding flow.
      The seed is idempotent: it uses a precondition to avoid re-creating the user.
      Password is hashed at boot by the application; this seed stores a placeholder
      hash that the operator MUST replace on first deploy (or via the API).
  - changeSet:
      id: 002-identity-seed-admin
      author: deer-planner
      labels: identity, seed
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users WHERE username = 'admin@deer'
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: id
                  value: 00000000-0000-0000-0000-000000000001
              - column:
                  name: username
                  value: admin@deer
              - column:
                  name: display_name
                  value: Administrator
              - column:
                  name: email
                  value: admin@deer
              - column:
                  name: password_hash
                  value: $2a$12$REPLACE_ME_WITH_REAL_BCRYPT_HASH_AT_FIRST_DEPLOY
                  remarks: Placeholder; replaced by the bootstrap endpoint or by the operator before first login.
              - column:
                  name: is_active
                  valueBoolean: true
        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: 00000000-0000-0000-0000-000000000001
              - column:
                  name: role
                  value: Administrator
