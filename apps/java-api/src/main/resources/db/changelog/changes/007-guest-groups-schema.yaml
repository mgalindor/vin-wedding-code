databaseChangeLog:
  - comment: >
      Guest groups schema (target data model v2.1.0).
      Source: 3-architecture/3.1-architecture/20260826-target-data-model.md §Guest List.
      Creates guest_groups (1 event -> N groups) with shared per-group contact info
      and a unique invitation_token. The FK to guests (primary_guest_id) is NOT created
      here — it is added in 011-guest-groups-add-fk-to-guests.yaml AFTER the guests
      table exists, breaking the circular dependency with 006-guests-schema.yaml.
  - changeSet:
      id: 007-guest-groups-create-table
      author: deer-planner
      labels: guests, schema
      changes:
        - createTable:
            tableName: guest_groups
            remarks: >
              One row per group. The Organizer fills the group metadata (name,
              relationship, shared email/phone) and guests fan out from this row.
            columns:
              - column:
                  name: id
                  type: varchar(20)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: varchar(20)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_guest_groups_event
                    references: events(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: varchar(180)
                  constraints:
                    nullable: false
                  remarks: 'Header row in the UI. Ej: Familia Morales, Frank & Laura.'
              - column:
                  name: relationship
                  type: varchar(20)
                  constraints:
                    nullable: false
                  remarks: 'Application-level enum: family | friends | other.'
              - column:
                  name: shared_email
                  type: varchar(254)
                  constraints:
                    nullable: true
              - column:
                  name: shared_phone
                  type: varchar(32)
                  constraints:
                    nullable: true
              - column:
                  name: primary_guest_id
                  type: varchar(20)
                  constraints:
                    nullable: true
                  remarks: >
                    FK to guests.id is added in changelog 011. The column exists from
                    creation time so the application can read/write it; only the
                    constraint is deferred.
              - column:
                  name: invitation_token
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_guest_groups_invitation_token
                  remarks: 'UUID v4 minted by the application. Path: /i/{token}.'
              - column:
                  name: display_order
                  type: smallint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                  remarks: Soft delete flag for Hibernate @SoftDelete. Rows are never physically removed.
        - sql:
            sql: >
              ALTER TABLE guest_groups
              ADD CONSTRAINT ck_guest_groups_relationship
              CHECK (relationship IN ('family','friends','other'));
        - createIndex:
            tableName: guest_groups
            indexName: idx_guest_groups_event_id
            columns:
              - column:
                  name: event_id
              - column:
                  name: display_order
        - createIndex:
            tableName: guest_groups
            indexName: idx_guest_groups_event_relationship
            columns:
              - column:
                  name: event_id
              - column:
                  name: relationship
  - changeSet:
      id: 007-guest-groups-ensure-updated-at-trigger
      author: deer-planner
      labels: guests, schema, trigger
      changes:
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER trg_guest_groups_set_updated_at
              BEFORE UPDATE ON guest_groups
              FOR EACH ROW
              EXECUTE FUNCTION set_updated_at();