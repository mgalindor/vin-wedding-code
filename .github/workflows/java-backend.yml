name: java-backend

on:
  push:
    branches: [main]
    paths:
      - 'apps/java-api/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deer-planner-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/java-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mvnw loses its executable bit when committed from Windows (git doesn't
      # track Unix file permissions there), so restore it before running it.
      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub's anonymous pull rate limit intermittently 502s on GitHub-hosted
      # runners (shared Azure IP pool). Pre-pull with retries so the registry hit
      # happens here, isolated from the ~9min Maven build.
      - name: Pre-pull Paketo builder/run images
        run: |
          for img in paketobuildpacks/builder-noble-java-tiny:latest paketobuildpacks/ubuntu-noble-run-tiny:latest; do
            for attempt in 1 2 3; do
              docker pull "$img" && break
              echo "Pull of $img failed (attempt $attempt), retrying in 15s..."
              sleep 15
            done
          done

      # Spring Boot builds and publishes the native image itself via Cloud Native
      # Buildpacks (Paketo) - no Dockerfile needed. Docker only needs to be running
      # on the runner, which it already is on ubuntu-latest. pullPolicy=IF_NOT_PRESENT
      # reuses the images pre-pulled above instead of hitting the registry again.
      - name: Build and publish native image
        run: |
          ./mvnw -B -Pnative \
            -Dspring-boot.build-image.imageName=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -Dspring-boot.build-image.publish=true \
            -Dspring-boot.build-image.pullPolicy=IF_NOT_PRESENT \
            spring-boot:build-image

      - name: Tag and push latest
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:latest
