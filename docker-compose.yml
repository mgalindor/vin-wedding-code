# Local development stack for Wendy Planner (OPS-023).
#
# Brings up only the dependencies the apps/api needs in dev: PostgreSQL 17.
# Other future services (MinIO for S3, MailHog, Redis) will be added when
# their owning stories (ARC-029/ARC-030, etc.) ship.
#
# No volumes, no container_name, no custom bridge — the default network is
# sufficient and ephemeral data is fine for local dev (recreate = clean DB).
#
# Usage:
#   pnpm docker:up      # start
#   pnpm docker:down    # stop and remove containers
#   pnpm docker:logs    # tail logs
#
# Once up, the API can connect via:
#   DATABASE_URL=postgresql://wendy:wendy@localhost:5432/wendy?schema=public
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wendy
      POSTGRES_PASSWORD: wendy
      POSTGRES_DB: wendy
    ports:
      - "5432:5432"
