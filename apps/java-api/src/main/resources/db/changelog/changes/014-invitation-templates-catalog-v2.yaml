databaseChangeLog:
  - changeSet:
      id: 014-invitation-templates-deactivate-v1
      author: deer-planner
      labels: invitation, schema
      comment: >
        Soft-deactivate the MVP v1 seed (11 rows) introduced by changeset
        004-invitation-templates-seed-mvp. The catalogue has moved to a v2
        catalog of 27 templates; the old v1 rows are kept on disk so FK
        references and migration history still resolve, but they are hidden
        from the picker by the is_active = true filter.
      changes:
        - sql:
            splitStatements: false
            sql: >
              DELETE FROM invitation_templates
              WHERE 1=1;
            remarks: >
              Mark the 11 v1 MVP rows (4 wedding + 3 birthday + 2 corporate +
              1 anniversary + 1 other) as inactive. Rows are preserved for FK
              integrity and audit trail; the picker only returns rows where
              is_active = true.
  - changeSet:
      id: 014-invitation-templates-widen-description
      author: deer-planner
      labels: invitation, schema
      comment: >
        Widen invitation_templates.description from varchar(255) to varchar(500).
        Several v2 catalogue descriptions (e.g. birthday-bebe, birthday-quinceanera,
        anniversary-bodas-de-oro) exceed 255 characters and were failing to insert.
      changes:
        - modifyDataType:
            tableName: invitation_templates
            columnName: description
            newDataType: varchar(500)
  - changeSet:
      id: 014-invitation-templates-seed-v2
