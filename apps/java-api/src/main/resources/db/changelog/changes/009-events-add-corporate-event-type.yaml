databaseChangeLog:
  - comment: >
      Extends the events.event_type check constraint to admit 'corporate', and
      brings the Java enum (EventType.java) into alignment with the invitation
      template catalogue — the seed already includes 2 corporate templates
      (tpl-corporate-conf-v1, tpl-corporate-launch-v1) that the enum previously
      rejected, leaving them unreachable from the UI. The invitation_templates
      check constraint already allowed 'corporate', so only events needs this
      update.
  - changeSet:
      id: 009-events-add-corporate-event-type
      author: deer-planner
      labels: events, schema
      changes:
        - sql:
            sql: >
              ALTER TABLE events
              DROP CONSTRAINT ck_events_event_type;
        - sql:
            sql: >
              ALTER TABLE events
              ADD CONSTRAINT ck_events_event_type
              CHECK (event_type IN ('wedding','birthday','anniversary','other','corporate'));